name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  LUALS_VERSION: "3.19.1"

jobs:
  build:
    name: Docs — Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install lua-language-server
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -sSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/luals"
          echo "LUA_LANGUAGE_SERVER=$RUNNER_TEMP/luals/bin/lua-language-server" >> "$GITHUB_ENV"

      # TypeDoc type-checks each package, so their dependencies must be installed.
      - name: Install dependencies
        run: |
          (cd docs && bun install --frozen-lockfile)
          (cd taletrack-frontend && bun install --frozen-lockfile)
          (cd taletrack-netflix-extension && bun install --frozen-lockfile)

      - name: Build docs
        run: bun docs/build.ts

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    name: Docs — Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
