name: Deploy

on:
  push:
    branches: [deploy]

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            # Only check out what the server needs (root files + these folders);
            # the extension, koplugin and tests never reach the working tree.
            git sparse-checkout set --cone TaleTrackApp taletrack-frontend scripts
            git pull origin deploy
            docker compose up -d --build backend frontend
