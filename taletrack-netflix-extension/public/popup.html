<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaleTrack · Netflix</title>
  <style>
    /* ─── TaleTrack design system ─────────────────────────────
       Tokens, type and components from taletrack-frontend (app/globals.css and
       the /extension-auth page). Light by default like the web; the toggle sets
       data-theme on <html>. */
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('fonts/geist-latin.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Cormorant Garamond';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('fonts/cormorant-garamond-600-latin.woff2') format('woff2');
    }

    /* Cottagecore light */
    :root {
      --background: oklch(0.97 0.015 82);
      --foreground: oklch(0.16 0.05 55);
      --card: oklch(0.99 0.007 82);
      --primary: oklch(0.48 0.09 132);
      --primary-foreground: oklch(0.99 0.007 82);
      --secondary: oklch(0.93 0.025 82);
      --muted: oklch(0.93 0.025 82);
      --muted-foreground: oklch(0.47 0.04 55);
      --destructive: oklch(0.577 0.245 27.325);
      --border: oklch(0.85 0.025 77);
      --input: oklch(0.90 0.018 80);
      --ring: oklch(0.48 0.09 132);
      --radius: 0.75rem;
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-heading: 'Cormorant Garamond', Georgia, serif;
      color-scheme: light;
    }

    /* Slate dark */
    :root[data-theme="dark"] {
      --background: oklch(0.16 0.012 260);
      --foreground: oklch(0.93 0.006 260);
      --card: oklch(0.20 0.012 260);
      --primary: oklch(0.62 0.09 132);
      --primary-foreground: oklch(0.16 0.012 260);
      --secondary: oklch(0.24 0.012 260);
      --muted: oklch(0.24 0.012 260);
      --muted-foreground: oklch(0.64 0.012 260);
      --destructive: oklch(0.65 0.22 25);
      --border: oklch(1 0 0 / 10%);
      --input: oklch(1 0 0 / 10%);
      --ring: oklch(0.62 0.09 132);
      color-scheme: dark;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      padding: 16px;
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      background: var(--background);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
    }

    svg {
      flex-shrink: 0;
    }

    /* Brand, as in the web's top nav */
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 0 2px;
    }

    .brand svg {
      width: 20px;
      height: 20px;
      color: var(--primary);
    }

    .brand-name {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 600;
      line-height: 1;
    }

    .brand-tag {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: color-mix(in oklab, var(--muted-foreground) 60%, transparent);
    }

    /* .tt-card */
    .card {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) * 1.8);
      background: var(--card);
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }

    .title {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 600;
      line-height: 1.2;
    }

    .sub {
      margin-top: 4px;
      font-size: 13.5px;
      color: var(--muted-foreground);
    }

    .heading-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .check {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: color-mix(in oklab, var(--primary) 15%, transparent);
      color: var(--primary);
    }

    .check svg {
      width: 16px;
      height: 16px;
    }

    /* Account box from /extension-auth */
    .account {
      margin-top: 16px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) * 1.4);
      background: color-mix(in oklab, var(--secondary) 20%, transparent);
    }

    .account-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: color-mix(in oklab, var(--muted-foreground) 60%, transparent);
    }

    .account-value {
      margin-top: 2px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13.5px;
      font-weight: 500;
    }

    .error {
      font-size: 13.5px;
      color: var(--destructive);
    }

    /* Button: default and outline variants of the web's ui/button */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin-top: 18px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:focus-visible {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 50%, transparent);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .btn-primary:hover {
      background: color-mix(in oklab, var(--primary) 80%, transparent);
    }

    .btn-outline {
      border-color: var(--border);
      background: var(--background);
      color: var(--foreground);
    }

    .btn-outline:hover {
      background: var(--muted);
    }

    [data-theme="dark"] .btn-outline {
      border-color: var(--input);
      background: color-mix(in oklab, var(--input) 30%, transparent);
    }

    [data-theme="dark"] .btn-outline:hover {
      background: color-mix(in oklab, var(--input) 50%, transparent);
    }

    /* Compact ThemeToggle from the web's top nav */
    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: color-mix(in oklab, var(--secondary) 60%, transparent);
      color: var(--muted-foreground);
      cursor: pointer;
      transition: background-color 0.15s;
      outline: none;
    }

    .theme-toggle:hover {
      background: var(--secondary);
    }

    .theme-toggle:focus-visible {
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 50%, transparent);
    }

    .theme-toggle svg {
      width: 15px;
      height: 15px;
    }

    .loading {
      display: flex;
      justify-content: center;
      padding: 28px 0;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid color-mix(in oklab, var(--primary) 30%, transparent);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 2s;
      }

      .btn {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true">
      <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
      <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
    </svg>
    <span class="brand-name">TaleTrack</span>
    <span class="brand-tag">Netflix</span>
    <button id="themeToggle" type="button" class="theme-toggle"></button>
  </div>

  <div id="authView" class="card" aria-live="polite">
    <div class="loading"><span class="spinner"></span></div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
